name: iot_controller
description: IoT Device Controller App - Control lights and fans via MQTT
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  mqtt_client: ^10.2.0
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  camera: ^0.10.5+5
  tflite_flutter: ^0.12.1
  web_socket_channel: ^2.1.0
  image: ^4.8.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.66.0
  vibration: ^3.1.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/dictionary.txt
    - assets/model.tflite
    - assets/labels.txt
